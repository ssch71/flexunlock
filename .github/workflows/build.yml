name: Build FlexUnlock APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'releases/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # Repo ships no Gradle wrapper (no gradlew / wrapper jar),
      # so provide Gradle 8.9 (matches gradle/wrapper/gradle-wrapper.properties).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Release signs only when keystore.properties exists (see cover-shell/build.gradle.kts).
      # Repo secrets -> real key. No secret -> ephemeral CI key so APK still installs.
      - name: Prepare signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            STOREPASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; KEYPASS="$KEY_PASSWORD"
            echo "Using repo keystore secret."
          else
            keytool -genkeypair -dname "CN=FlexUnlock CI" -alias ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore "$KS" -storepass android -keypass android
            STOREPASS=android; ALIAS=ci; KEYPASS=android
            echo "::warning::No KEYSTORE_B64 secret - built with ephemeral CI key. Signature changes every build (reinstall, not update-over)."
          fi
          {
            echo "storeFile=$KS"
            echo "storePassword=$STOREPASS"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEYPASS"
          } > keystore.properties

      - name: Assemble release APK
        run: gradle :cover-shell:assembleRelease --no-daemon --stacktrace

      - name: Unit tests
        run: gradle :cover-shell:testReleaseUnitTest --no-daemon --stacktrace

      - name: Stage APK
        if: always()
        run: |
          mkdir -p dist
          cp cover-shell/build/outputs/apk/release/*.apk \
             "dist/FlexUnlock-$(grep VERSION_NAME gradle.properties | cut -d= -f2)-release.apk" 2>/dev/null || true
          ls -la dist || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlexUnlock-release-apk
          path: dist/*.apk
          if-no-files-found: warn
